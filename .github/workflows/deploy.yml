name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    name: Build image & deploy to EC2
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (skip if this commit is already built)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image for $GITHUB_SHA already exists, skipping build"
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi

      - name: Deploy via SSM Run Command
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          LOG_GROUP: ${{ vars.LOG_GROUP }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          PARAMS=$(jq -n \
            --arg img "$IMAGE" --arg reg "$REGISTRY" --arg region "$AWS_REGION" \
            --arg ver "$GITHUB_SHA" --arg lg "$LOG_GROUP" \
            '{commands: [
              "set -euo pipefail",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($reg)",
              "docker pull \($img)",
              "docker rm -f reel_finder || true",
              "docker run -d --name reel_finder --restart unless-stopped -p 80:3000 -e APP_VERSION=\($ver) --log-driver=awslogs --log-opt awslogs-region=\($region) --log-opt awslogs-group=\($lg) \($img)",
              "docker image prune -af --filter until=72h || true"
            ]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID")
          echo "$RESULT" | jq -r '.StandardOutputContent, .StandardErrorContent'

          STATUS=$(echo "$RESULT" | jq -r .Status)
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1

      - name: Smoke test (health + version)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 12); do
            VERSION=$(curl -fsS "$APP_URL/api/health" | jq -r .version || true)
            if [ "$VERSION" = "$GITHUB_SHA" ]; then
              echo "Deployed version $VERSION is healthy"
              exit 0
            fi
            echo "Attempt $i: got '$VERSION', waiting..."
            sleep 5
          done
          echo "Health check failed after deploy"
          exit 1
